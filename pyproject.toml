[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whispernet-lab"
version = "0.1.0"
description = "Reproducible UDP timing-channel and statistical-detection teaching laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "reportlab>=4.4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
whispernet = "whispernet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

